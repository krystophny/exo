[project]
name = "exo"
version = "0.3.70"
description = "Exo"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "aiofiles>=24.1.0",
  "aiohttp>=3.12.14",
  "types-aiofiles>=24.1.0.20250708",
  "pydantic>=2.11.7",
  "fastapi>=0.116.1",
  "filelock>=3.18.0",
  "rustworkx>=0.17.1",
  "huggingface-hub>=1.8.0",
  "psutil>=7.0.0",
  "loguru>=0.7.3",
  "exo-rs",                          # rust bindings
  "anyio==4.11.0",
  "tiktoken>=0.12.0",                # required for kimi k2 tokenizer
  "hypercorn>=0.18.0",
  "openai-harmony>=0.0.8",
  "httpx>=0.28.1",
  "tomlkit>=0.14.0",
  "python-multipart>=0.0.21",
  "msgspec>=0.19.0",
  "zstandard>=0.23.0",
  "transformers>=5.6.2",
  "python-daemon>=3.1.2",
]

[project.scripts]
exo = "exo.main:main"

# dependencies only required for development
[dependency-groups]
dev = [
  "basedpyright>=1.37.1",
  "pyinstaller>=6.17.0",
  "playwright>=1.52.0",
  "pytest==9.0.2",
  "pytest-asyncio>=1.0.0",
  "pytest-env",
  "httpx2",                # Starlette 1.x TestClient transport
  "ruff==0.14.11",
]

[project.optional-dependencies]
build = ["nanobind"]
mlx-none = ["anyio"]
mlx = [
  "mlx>=0.32.3.dev20260927; sys_platform == 'darwin'",
  "mlx-lm",
  "mlx-vlm>=0.3.11",
  "mflux==0.17.5",
  "torch==2.10.0; sys_platform == 'darwin'",
  "torchaudio==2.10.0; sys_platform == 'darwin'",
  "torchvision==0.25.0; sys_platform == 'darwin'",
]
###
# workspace configuration
###

[tool.uv.workspace]
members = ["rust/exo_rs", "bench", "tools"]

[tool.uv.sources]
exo-rs = { workspace = true }
mlx = { git = "https://github.com/krystophny/mlx-jaccl-fix-small-recv", rev = "1d4368eb7006be8104c11950ade3ae835fe65396" }
mlx-lm = { git = "https://github.com/krystophny/mlx-lm", rev = "2c03d14c64a5b135019faae10f0e774f1d627601" }
mflux = { git = "https://github.com/evanev7/mflux", branch = "exo2" }
[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

###
# type-checker configuration
###

[tool.basedpyright]
include = ["src", "bench", "tools"]
typeCheckingMode = "strict"
failOnWarnings = true

reportAny = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingParameterType = "error"
reportMissingTypeStubs = "error"
reportInvalidCast = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"

pythonVersion = "3.13"
pythonPlatform = "Darwin"

exclude = [
  "**/.venv",
  "**/venv",
  "**/__pycache__",
  "**/exo_scripts",
  "**/.direnv",
  "**/rust",
  "**/.github",
]
stubPath = ".typings"

[[tool.basedpyright.executionEnvironments]]
root = "src/exo/worker/engines/image"
reportMissingModuleSource = false

[[tool.basedpyright.executionEnvironments]]
root = "src"

[[tool.basedpyright.executionEnvironments]]
root = "bench"
extraPaths = ["tools/src"]

[[tool.basedpyright.executionEnvironments]]
root = "tools/src"


###
# uv configuration
###

# supported platforms for this project
[tool.uv]
required-version = ">=0.8.6"
prerelease = "allow"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
override-dependencies = ["opencv-python; python_version < '0'"]

[tool.uv.extra-build-dependencies]
miniaudio = ["setuptools", "cffi", "pycparser"]
mlx = [
  "setuptools",
  "typing-extensions",
  "nanobind",
  "pybind11",
  "wheel",
  "cmake",
  "ninja",
]
mlx-lm = ["setuptools"]
mflux = ["uv_build"]
xgrammar = [
  "nanobind",
  "setuptools",
  "scikit-build-core",
  "packaging",
  "pathspec",
]
rouge-score = ["setuptools"]
sacrebleu = ["setuptools"]
sqlitedict = ["setuptools"]
word2number = ["setuptools"]
vllm = [
  "setuptools",
  "setuptools-scm",
  "scikit-build-core",
  "jinja2",
  "wheel",
  "markupsafe",
  "typing-extensions",
  "torch",
]
fastsafetensors = ["setuptools", "pybind11"]
torch = ["typing-extensions"]
torchvision = ["torch"]
torchaudio = ["torch"]

###
# ruff configuration
###

[tool.ruff]
extend-exclude = [".typings/**", "rust/exo_rs/**", "bench/vendor/**"]

[tool.ruff.lint]
extend-select = ["I", "N", "B", "A", "PIE", "SIM"]

[tool.pytest.ini_options]
testpaths = ["src", "rust/exo_rs/tests"]
pythonpath = "."
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselected by default)"]
env = ["EXO_TESTS=1"]
addopts = "-m 'not slow' --ignore=tests --ignore=tmp"
filterwarnings = ["ignore:builtin type Swig:DeprecationWarning"]
