model_id = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
n_layers = 40
hidden_size = 5120
num_key_value_heads = 1
supports_tensor = true
tasks = ["TextGeneration"]
family = "deepseek"
quantization = "fp8"
base_model = "DeepSeek V4.1 Flash"
capabilities = ["text", "thinking", "thinking_toggle"]
reasoning_dialect = "tool_conditional"
context_length = 1048576
backends = ["MlxMetal"]
# mlx-lm runs V4.1's own pipeline, whose last rank holds the first layers.
pipeline_layers_reversed = true

# Native checkpoint: fp8 (32x32 blocks, ue8m0 scales) with fp4 experts.
# total_size from model.safetensors.index.json; it includes the MTP and vision
# weights that mlx-lm drops on load.
[storage_size]
in_bytes = 510286023000

# The two Engram layers' weights (n-gram table plus wkv), from the sizes of
# model-00047 (layer 1) and model-00048 (layer 14), which hold nothing else.
[[extra_layer_storage]]
layer = 1
[extra_layer_storage.storage_size]
in_bytes = 101535150936

[[extra_layer_storage]]
layer = 14
[extra_layer_storage.storage_size]
in_bytes = 101537926640

# Source: https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash-1017
[sampling_defaults]
temperature = 1.0
top_p = 1.0
